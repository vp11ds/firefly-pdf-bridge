name: firefly-test

x-private: &private
  networks:
    - backend
  restart: unless-stopped

services:
  proxy:
    image: caddy@sha256:c3d7ee5d2b11f9dc54f947f68a734c84e9c9666c92c88a7f30b9cba5da182adb
    container_name: firefly-test-proxy
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./firefly/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
      - backend
    depends_on:
      - sso
      - firefly
      - importer
    restart: unless-stopped

  sso:
    image: authelia/authelia@sha256:d23ee3c721d465b4749cc58541cda4aebe5aa6f19d7b5ce0afebb44ebee69591
    container_name: firefly-test-sso
    environment:
      AUTHELIA_SESSION_SECRET: ${AUTHELIA_SESSION_SECRET:?Set a generated AUTHELIA_SESSION_SECRET in .env}
      AUTHELIA_STORAGE_ENCRYPTION_KEY: ${AUTHELIA_STORAGE_ENCRYPTION_KEY:?Set a generated AUTHELIA_STORAGE_ENCRYPTION_KEY in .env}
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET: ${AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET:?Set a generated AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET in .env}
    volumes:
      - ./firefly/authelia:/config:ro
      - authelia_data:/data
    networks:
      - backend
    restart: unless-stopped

  db:
    image: mariadb@sha256:6422478cb8e159f080fb1d8ccf65101e26fe51385787fde7d16c3b165a331f15
    container_name: firefly-test-db
    environment:
      MARIADB_DATABASE: firefly
      MARIADB_USER: firefly
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - firefly_test_db_v2:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - backend
    restart: unless-stopped

  firefly:
    image: fireflyiii/core@sha256:a2b53539338d1cd04d341b229c3806cb178cf64c72459060e3ed34bec4167bd8
    container_name: firefly-test-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_KEY: ${APP_KEY:?Set APP_KEY in .env}
      APP_URL: https://firefly.test:8080
      APP_ENV: production
      APP_DEBUG: "false"
      SITE_OWNER: ${SSO_EMAIL:?Set SSO_EMAIL to the Authelia/Firefly account email}
      TRUSTED_PROXIES: "*"
      AUTHENTICATION_GUARD: ${AUTHENTICATION_GUARD:-web}
      AUTHENTICATION_GUARD_HEADER: HTTP_REMOTE_EMAIL
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: firefly
      DB_USERNAME: firefly
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - firefly_test_upload_v2:/var/www/html/storage/upload
    networks:
      - backend
    restart: unless-stopped

  importer:
    image: fireflyiii/data-importer@sha256:2627644321afdcb52b49b258126bfe98312c2f93a709cc3a07c90327854e6aa2
    container_name: firefly-test-importer
    environment:
      FIREFLY_III_URL: http://firefly:8080
      VANITY_URL: https://firefly.test:8080
      FIREFLY_III_ACCESS_TOKEN: ${FIREFLY_III_ACCESS_TOKEN:-}
    volumes:
      - firefly_test_import_v2:/import
    networks:
      - backend
    restart: unless-stopped

volumes:
  firefly_test_db_v2:
  firefly_test_upload_v2:
  firefly_test_import_v2:
  authelia_data:
  caddy_data:
  caddy_config:

networks:
  edge:
  backend:
    internal: true
