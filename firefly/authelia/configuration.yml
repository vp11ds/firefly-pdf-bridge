server:
  address: tcp://0.0.0.0:9091/

log:
  level: info

authentication_backend:
  file:
    path: /config/users_database.yml
    watch: true

totp:
  issuer: firefly.test

access_control:
  default_policy: deny
  rules:
    - domain:
        - firefly.test
        - importer.firefly.test
        - bridge.firefly.test
      policy: two_factor

session:
  secret: ${AUTHELIA_SESSION_SECRET}
  name: authelia_session
  same_site: lax
  inactivity: 5m
  expiration: 1h
  cookies:
    - domain: firefly.test
      authelia_url: https://auth.firefly.test:8080
      default_redirection_url: https://firefly.test:8080
      name: authelia_session
      same_site: lax
      inactivity: 5m
      expiration: 1h
      remember_me: -1

regulation:
  modes:
    - user
    - ip
  max_retries: 3
  find_time: 2m
  ban_time: 5m

storage:
  encryption_key: ${AUTHELIA_STORAGE_ENCRYPTION_KEY}
  local:
    path: /data/db.sqlite3

notifier:
  filesystem:
    filename: /data/notification.txt

identity_validation:
  reset_password:
    jwt_secret: ${AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET}
